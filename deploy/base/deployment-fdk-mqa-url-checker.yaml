apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdk-mqa-url-checker
  labels:
    app: fdk-mqa-url-checker
    fdk.service: fdk-mqa-url-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      fdk.service: fdk-mqa-url-checker
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fdk-mqa-url-checker
        fdk.service: fdk-mqa-url-checker
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: fdk-mqa-url-checker
          image: fdk-mqa-url-checker
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "1Gi"
              cpu: "300m"
            limits:
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - "true"
          readinessProbe:
            exec:
              command:
                - "true"
          env:
            - name: RUST_LOG
              value: info
            - name: NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: common
                  key: NAMESPACE
            - name: SCHEMA_REGISTRY
              valueFrom:
                secretKeyRef:
                  name: fdk-metadata-quality
                  key: SCHEMA_REGISTRY
            - name: BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-url-checker
                  key: BROKERS
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-url-checker
                  key: SECURITY_PROTOCOL
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-url-checker
                  key: SASL_MECHANISM
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-url-checker
                  key: USERNAME
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-url-checker
                  key: PASSWORD
      restartPolicy: Always
